<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ρυθμίσεις</title>
  <link rel="manifest" href="../manifest.webmanifest?v=19" />
  <link rel="stylesheet" href="../styles.css?v=19" />
</head>
<body>
  <div class="container">
    <div class="pageHeader">
      <button class="hamburger" id="openDrawer" aria-label="menu">☰</button>
      <div class="pageTitle" id="settingsTitle">Ρυθμίσεις</div>
    </div>

    <div class="card">
      <div class="sectionTitle">Παράμετροι μοντέλου (προσωρινές αλλαγές)</div>
      <p class="small">
        Οι αλλαγές αποθηκεύονται τοπικά (στη συσκευή/φυλλομετρητή) και εφαρμόζονται μέχρι να γίνει επαναφορά.
      </p>

      <div class="formGrid">
        <div class="field" style="grid-column: 1 / -1;">
          <label>Ένταση άνθρακα δικτύου (CI) (kg CO₂/kWh)</label>
          <div class="row2" style="align-items:flex-end;">
            <input id="ciValue" type="number" step="0.01" min="0" />
            <label class="checkRow" style="margin:0;">
              <input id="ciEnable" type="checkbox" />
              <span>Χρήση προσαρμοσμένης τιμής</span>
            </label>
          </div>
          <div class="small" id="ciHint"></div>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
          <label>Στόχος ΕΕ 2030 (t CO₂/έτος)</label>
          <div class="row2" style="align-items:flex-end;">
            <input id="euTargetValue" type="number" step="0.01" min="0" />
            <label class="checkRow" style="margin:0;">
              <input id="euTargetEnable" type="checkbox" />
              <span>Χρήση προσαρμοσμένης τιμής</span>
            </label>
          </div>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
          <label>Κοινόχρηστες υπηρεσίες & υποδομές (t CO₂/έτος)</label>
          <div class="row2" style="align-items:flex-end;">
            <input id="socialValue" type="number" step="0.01" min="0" />
            <label class="checkRow" style="margin:0;">
              <input id="socialEnable" type="checkbox" />
              <span>Χρήση προσαρμοσμένης τιμής</span>
            </label>
          </div>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
          <label>Μετρό / Τραμ — ενέργεια (kWh ανά επιβατοχιλιόμετρο)</label>
          <div class="row2" style="align-items:flex-end;">
            <input id="metroEnergyValue" type="number" step="0.01" min="0" />
            <label class="checkRow" style="margin:0;">
              <input id="metroEnergyEnable" type="checkbox" />
              <span>Χρήση προσαρμοσμένης τιμής</span>
            </label>
          </div>
          <div class="small">Οι εκπομπές μετρό/τραμ υπολογίζονται ως: kWh/pkm × CI.</div>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
          <div class="bottomRow">
            <button class="pillBtn" id="saveBtn">Αποθήκευση</button>
            <button class="pillBtn" id="resetBtn">Επαναφορά</button>
            <button class="pillBtn" id="backBtn">←</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/common.js?v=19"></script>
  <script src="../js/menu.js?v=19"></script>
  <script src="../js/settings.js?v=19"></script>

  <div class="drawerBackdrop" id="drawerBackdrop" aria-hidden="true"></div>
  <nav class="drawer" id="drawer" aria-hidden="true">
    <div class="drawerHeader">
      <button class="drawerClose" id="closeDrawer" aria-label="close">✕</button>
    </div>
    <div class="drawerNav" id="drawerNav"></div>
  </nav>
</body>
</html>
