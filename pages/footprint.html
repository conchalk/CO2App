<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CO2 Footprint</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

<!-- Drawer (keep existing pattern) -->
<div id="drawerBackdrop" class="drawerBackdrop"></div>
<div id="drawer" class="drawer">
  <div class="drawerHeader">
    <div class="drawerTitle">CO2App</div>
    <button id="drawerClose" class="drawerClose" aria-label="Close">×</button>
  </div>
  <div id="drawerNav" class="drawerNav"></div>
  <div id="drawerLang" class="drawerLang"></div>
</div>

<header class="topbar">
  <button aria-label="Menu" class="iconBtn" id="menuBtn"><span class="hamburger"><span></span></span></button>
  <div class="topbarTitles">
    <div class="pageTitle" id="title"></div>
    <div class="pageSubtitle" id="subtitle"></div>
  </div>
  <div class="langBtns">
    <button class="langBtn" id="langElBtn">ΕΛ</button>
    <button class="langBtn" id="langEnBtn">EN</button>
  </div>
</header>

<div class="page">

  <div class="cardNav" id="cardNav">
    <button class="chip" id="navHome"></button>
    <button class="chip" id="navTransport"></button>
    <button class="chip" id="navLifestyle"></button>
  </div>

  <!-- HOME -->
  <div class="card" id="cardHome">
    <h3 id="homeTitle" style="margin:0 0 10px 0;"></h3>
    <div class="formGrid">
      <div class="field">
        <label for="homeType" id="lblHomeType"></label>
        <select id="homeType"></select>
      </div>
      <div class="field">
        <label for="homeCond" id="lblHomeCond"></label>
        <select id="homeCond"></select>
      </div>
      <div class="field">
        <label for="heatingType" id="lblHeating"></label>
        <select id="heatingType"></select>
      </div>

      <div class="field">
        <label for="occupants" id="lblOccupants"></label>
        <select id="occupants"></select>
      </div>
      <div class="field">
        <label for="solarDHW" id="lblSolarDHW"></label>
        <select id="solarDHW"></select>
      </div>

      <div class="field" style="grid-column: 1 / -1;">
        <label for="homeUseLevel" id="lblHomeUse"></label>
        <input id="homeUseLevel" type="range" min="0" max="100" step="1" value="50">
        <div class="rangeRow">
          <div class="small" id="homeUseMin"></div>
          <div class="small" id="homeUseMid"></div>
          <div class="small" id="homeUseMax"></div>
        </div>
        <div class="rangeRow">
          <div class="small"><span id="homeUseVal">50</span></div>
          <div class="small" id="homeUseLabel"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TRANSPORT -->
  <div class="card" id="cardTransport">
    <h3 id="trTitle" style="margin:0 0 10px 0;"></h3>
    <div class="formGrid">
      <div class="field">
        <label for="weeklyKm" id="lblWeeklyKm"></label>
        <input id="weeklyKm" type="number" min="0" step="1" value="40">
      </div>
      <div class="field">
        <label for="carType" id="lblCarType"></label>
        <select id="carType"></select>
      </div>


      <div class="field">
        <label for="publicTransport" id="lblPublicTransport"></label>
        <select id="publicTransport">
          <option value="bus">Bus</option>
          <option value="train">Train</option>
        </select>
      </div>

      <div class="field">
        <label for="publicPct" id="lblPublicPct"></label>
        <input id="publicPct" type="range" min="0" max="100" step="1" value="0">
        <div class="rangeLabels">
          <span>0%</span><span id="publicPctVal">0%</span><span>100%</span>
        </div>
      </div>

      <div class="field">
        <label for="flightTripsDomestic" id="lblFlightsDomestic"></label>
        <input id="flightTripsDomestic" type="number" min="0" step="1" value="0">
      </div>
      <div class="field">
        <label for="flightTripsEurope" id="lblFlightsEurope"></label>
        <input id="flightTripsEurope" type="number" min="0" step="1" value="0">
      </div>

      <div class="field" style="grid-column: 1 / -1;">
        <div class="small" id="flightHint"></div>
      </div>
    </div>
  </div>

  <!-- LIFESTYLE -->
  <div class="card" id="cardLifestyle">
    <h3 id="lifeTitle" style="margin:0 0 10px 0;"></h3>
    <div class="formGrid">

      <div class="field">
        <label for="diet" id="lblDiet"></label>
        <select id="diet">
          <option value="vegan">Vegan</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="mediterranean">Mediterranean</option>
          <option value="standard">Standard</option>
          <option value="high_meat">High meat</option>
        </select>
        <div class="small" id="dietHint"></div>
      </div>

      <div class="field">
        <label for="goodsProfile" id="lblGoodsProfile"></label>
        <select id="goodsProfile"></select>
        <div class="small" id="goodsHint"></div>
      </div>

      <div class="field" style="grid-column: 1 / -1;">
        <label for="digitalLevel" id="lblDigitalLevel"></label>
        <input id="digitalLevel" type="range" min="0" max="100" step="1" value="50">
        <div class="rangeRow">
          <div class="small" id="digitalMin"></div>
          <div class="small" id="digitalMid"></div>
          <div class="small" id="digitalMax"></div>
        </div>
        <div class="rangeRow">
          <div class="small"><span id="digitalVal">50</span></div>
          <div class="small" id="digitalLabel"></div>
        </div>
      </div>

      <div class="field" style="grid-column: 1 / -1;">
        <div class="fixedLine">
          <span id="lblSocialShare"></span>
          <strong><span id="socialShareVal"></span></strong>
        </div>
      </div>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="card" id="cardSummary">
    <h3 id="lblTotal" style="margin:0 0 10px 0;"></h3>

    <div class="kpiRow">
      <div class="kpiBox">
        <div class="kpiValue"><span id="totalVal">—</span> <span class="kpiUnit">t CO₂/έτος</span></div>
        <div class="kpiSub" id="reducePct"></div>
      </div>
    </div>

    <div class="btnRow">
      <button class="primaryBtn" id="btnCalc"></button>
      <button class="secondaryBtn" id="btnDash"></button>
    </div>
  </div>

</div>

<script src="../js/common.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/footprint.js"></script>
</body>
</html>
